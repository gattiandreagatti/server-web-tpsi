<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Palette Colori</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <h1>Palette Generator</h1>

    <script src="app.js"></script>
</body>
</html>
